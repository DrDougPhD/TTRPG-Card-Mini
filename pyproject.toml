[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cardstockminis"
dynamic = ["version"]
description = 'Quickly create NPC or monster minis for printout and mounting to a card stand.'
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = ["ttrpg", "miniatures"]
authors = [
  { name = "Doug McGeehan", email = "doug@kmnr.org" },
]
classifiers = [
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
]

[project.urls]
Documentation = "https://github.com/Doug McGeehan/TTRPG-Card-Mini#readme"
Issues = "https://github.com/Doug McGeehan/TTRPG-Card-Mini/issues"
Source = "https://github.com/Doug McGeehan/TTRPG-Card-Mini"

[tool.hatch.version]
path = "src/cardstockminis/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cardstockminis"]

[tool.hatch.build.targets.sdist]
include = [
  "src/cardstockminis/",
  "tests/",
  "pyproject.toml",
  "README.*"
]

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/cardstockminis tests}"

[tool.coverage.run]
source_pkgs = ["cardstockminis", "tests"]
branch = true
parallel = true

[tool.coverage.paths]
cardstockminis = ["src/cardstockminis"]
tests = ["tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
